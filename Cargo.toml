[package]
name = "profold"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "A molecular viewer for proteins, molecules, crystals and simulations, with structure prediction as a plugin"
repository = "https://github.com/odexion/profold"

[dependencies]
gpui = "0.2.2"
image = "0.25"
smallvec = "1"
unicode-segmentation = "1"
anyhow = "1"
ureq = "3"
serde_json = "1"
dirs = "6"
flate2 = "1"
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12", "gles"] }
pollster = "0.4"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }
# The updater: release archives are gzipped tarballs with a SHA-256 beside them.
tar = "0.4"
sha2 = "0.10"
# Finds `uv` for the folding plugin, with PATHEXT on Windows.
which = "7"

[features]
default = ["simplefold"]
# Structure prediction with Apple's SimpleFold, run as a Python sidecar.
# Build with --no-default-features for the viewer alone.
simplefold = []

# The software rasterizer is unusable at opt-level 0.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

# The Dock icon, set at launch so an unbundled build shows it too.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }

# `profold --version` prints to the terminal it was run from, although a
# release build has no console of its own.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

# The icon in Explorer and the taskbar.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.bundle]
name = "profold"
identifier = "dev.profold"
icon = ["assets/profold.icns"]
