[package]
name = "profold"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
image = "0.25"
smallvec = "1"
unicode-segmentation = "1"
anyhow = "1"
ureq = "3"
serde_json = "1"
dirs = "6"
flate2 = "1"
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan", "dx12", "gles"] }
pollster = "0.4"
rayon = "1"
bytemuck = { version = "1", features = ["derive"] }

[features]
default = ["simplefold"]
# Structure prediction with Apple's SimpleFold, run as a Python sidecar.
# Build with --no-default-features for the viewer alone.
simplefold = []

# The software rasterizer is unusable at opt-level 0.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

# The Dock icon, set at launch so an unbundled build shows it too.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }

[package.metadata.bundle]
name = "profold"
identifier = "dev.profold"
icon = ["assets/profold.icns"]
